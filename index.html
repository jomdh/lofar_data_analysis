<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CWL I/O graph</title>
<style>
  :root {
    --bg:#0e1117; --panel:#161b22; --border:#30363d; --text:#e6edf3;
    --muted:#8b949e; --accent:#e3b341; --link:#79c0ff;
    --start:#4da3ff; --end:#3dd68c;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.45 ui-sans-serif, system-ui, sans-serif; }
  header {
    display:flex; flex-wrap:wrap; gap:.5rem 1rem; align-items:center;
    padding:.55rem 1rem; border-bottom:1px solid var(--border);
  }
  h1 { font-size:1rem; margin:0; font-weight:650; }
  #q, select, input[type=number] {
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:.35rem .55rem; font:inherit;
  }
  #q { min-width:14rem; }
  button {
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:.3rem .6rem; font:inherit; cursor:pointer;
  }
  .legend span { display:inline-flex; align-items:center; gap:.3rem; margin-right:.8rem; color:var(--muted); font-size:.8rem; }
  .dot { width:.7rem; height:.7rem; border-radius:50%; display:inline-block; }
  #layout { display:flex; height:calc(100% - 52px); }
  #net { flex:1; min-width:0; }
  #side {
    width:22rem; border-left:1px solid var(--border); padding:.8rem 1rem;
    overflow:auto; background:var(--panel);
  }
  #side h2 { font-size:.9rem; margin:.2rem 0 .5rem; }
  #side pre { white-space:pre-wrap; font:12px/1.4 ui-monospace, Menlo, Consolas, monospace; color:#c9d1d9; }
  .meta { color:var(--muted); font-size:.8rem; }
  code { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:.85em; }
  #tip {
    position:fixed; display:none; z-index:50; pointer-events:none;
    background:#1c2129; color:#e6edf3; border:1px solid #e3b341;
    border-radius:6px; padding:.35rem .6rem; font:13px/1.3 ui-monospace, Menlo, Consolas, monospace;
    max-width:28rem; box-shadow:0 4px 16px #0008;
  }
</style>
</head>
<body>
<header>
  <h1>CWL I/O graph</h1>
  <input id="q" type="search" placeholder="Filter node id…">
  <label class="meta">min weight <input id="minw" type="number" min="1" value="1" style="width:4rem"></label>
  <select id="pipe"><option value="">all pipelines</option></select>
  <label class="meta">node size
    <select id="sizeby">
      <option value="both">both (in+out)</option>
      <option value="in">incoming</option>
      <option value="out">outgoing</option>
      <option value="closeness">closeness</option>
      <option value="betweenness">betweenness</option>
    </select>
  </label>
  <label class="meta"><input id="thick" type="checkbox" checked> thicker links by weight</label>
  <label class="meta"><input id="engines" type="checkbox" checked> group by engine (DP3 / WSClean / …)</label>
  <label class="meta"><input id="collapse" type="checkbox" checked> collapse Module.sub</label>
  <label class="meta"><input id="current" type="checkbox" checked> official clones only</label>
  <button type="button" id="physics">Physics off</button>
  <button type="button" id="fit">Fit</button>
  <span class="legend">
    <span><i class="dot" style="background:var(--start)"></i> start</span>
    <span><i class="dot" style="background:var(--end)"></i> end</span>
    <span><i class="dot" style="background:#8b949e"></i> CWL element</span>
  </span>
  <span class="meta" id="stats"></span>
</header>
<div id="layout">
  <div id="net"></div>
  <aside id="side">
    <h2>Selection</h2>
    <p class="meta">Click a node or a link. Node size follows incoming / outgoing / both / closeness / betweenness. Links can be scaled by weight. <code>pipelines</code> lists which applications mention a link.</p>
    <pre id="detail">nothing selected</pre>
  </aside>
</div>
<div id="tip"></div>

    document.getElementById("net").addEventListener("mousemove", ev => {
      if (tip.style.display === "block") {
        tip.style.left = (ev.clientX + 12) + "px";
        tip.style.top = (ev.clientY + 12) + "px";
      }
    });
  } else {
    nodesDS.clear(); edgesDS.clear();
    nodesDS.add(nvis); edgesDS.add(evis);
  }
}

document.getElementById("q").addEventListener("input", draw);
document.getElementById("minw").addEventListener("input", draw);
document.getElementById("pipe").addEventListener("change", draw);
document.getElementById("sizeby").addEventListener("change", draw);
document.getElementById("thick").addEventListener("change", draw);
document.getElementById("collapse").addEventListener("change", draw);
document.getElementById("engines").addEventListener("change", draw);
document.getElementById("current").addEventListener("change", draw);
let phys = true;
document.getElementById("physics").onclick = () => {
  phys = !phys;
  network.setOptions({ physics: { enabled: phys } });
  document.getElementById("physics").textContent = phys ? "Physics off" : "Physics on";
};
document.getElementById("fit").onclick = () => network.fit();
draw();
</script>
</body>
