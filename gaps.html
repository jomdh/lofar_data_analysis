ay": "L2", "tlay": "L2", "concern": "image", "io": "ms, fits", "drift": "copy: wsclean-mp is the same imager under MPI, built only when MPI is found", "tags": ["copy"], "layer_move": false, "lang_move": false, "concern_leak": false}];
const LAYERS = ["L5", "L4", "L3", "L2", "L1", "L0"];
const CONCERNS = ["platform", "visibility", "beam", "solutions", "sky", "image", "inspect", "archive", "schedule"];

function cls(r) {
  if (r.layer_move && r.concern_leak) return "both";
  if (r.layer_move) return "move";
  if (r.concern_leak) return "leak";
  return "";
}

function draw() {
  const only = document.getElementById("leaks").checked;
  const shown = ROWS.filter(r => !only || r.layer_move || r.concern_leak);
  document.getElementById("stats").textContent =
    shown.length + " of " + ROWS.length + " components";
  let html = "<tr><th></th>" + CONCERNS.map(c => "<th>" + c + "</th>").join("") + "</tr>";
  for (const layer of LAYERS) {
    html += "<tr><th class='lay'>" + layer + "</th>";
    for (const concern of CONCERNS) {
      const items = shown.filter(r => r.clay === layer && r.concern === concern);
      const chips = items.map(r => {
        const prefix = r.context + ".";
        const comp = r.id.startsWith(prefix) ? r.id.slice(prefix.length) : r.id;
        return "<span class='chip " + cls(r) + "' data-id='" + r.id + "'>" +
          "<span class='prog'>" + r.context + "</span>" +
          "<span class='comp'>" + comp + "</span></span>";
      }).join("");
      const n = items.length ? "<span class='n'>" + items.length + "</span>" : "";
      html += "<td class='cell'>" + n + chips + "</td>";
    }
    html += "</tr>";
  }
  document.getElementById("grid").innerHTML = html;
  document.querySelectorAll(".chip").forEach(el => {
    el.addEventListener("click", () => {
      const r = ROWS.find(x => x.id === el.dataset.id);
      const move = r.clay === r.tlay ? r.clay : (r.clay + " → " + r.tlay);
      const lang = r.clang === r.tlang ? r.clang : (r.clang + " → " + r.tlang);
      document.getElementById("detail").textContent =
        r.id + "\n" + r.context + "  " + lang + "  " + move +
        "  " + r.concern + "\n" + r.io + "\n" + (r.drift || "no drift");
    });
  });
}
document.getElementById("leaks").addEventListener("change", draw);
draw();
</script>
